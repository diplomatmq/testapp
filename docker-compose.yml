services:
  postgres:
    image: postgres:16-alpine
    container_name: monkey_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: testapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: monkey_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/testapp
      FRONTEND_URL: https://test.monkeysdynasty.website
      BACKEND_URL: https://test.monkeysdynasty.website
    depends_on:
      - postgres
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: monkey_frontend

  caddy:
    image: caddy:2-alpine
    container_name: monkey_caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
